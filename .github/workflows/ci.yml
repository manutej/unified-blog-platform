name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Lint is a hard gate: the 7 previously-failing errors were fixed at
      # source (no baseline override needed). Remaining warnings stay visible
      # but do not fail the run.
      - name: Lint
        run: npm run lint

      - name: Unit & accessibility tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
