name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      # Lint surfaces pre-existing app warnings/errors but must not block the
      # pipeline; keep it visible without failing the build.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit & accessibility tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
